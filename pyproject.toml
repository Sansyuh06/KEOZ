[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keoz"
version = "1.0.0"
description = "KEOZ — The Merchant Command Center for Agentic Commerce (Razorpay & ACP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pyjwt>=2.8.0",
    "requests>=2.31.0",
    "rich>=13.0.0"
]

[project.scripts]
keoz = "keoz.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
